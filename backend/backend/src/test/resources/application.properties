spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:verdida_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-jwt-secret-for-tests-only
app.auth.cookie.secure=false

app.cors.origins=http://localhost:3000,http://localhost:5173
