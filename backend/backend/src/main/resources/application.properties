spring.application.name=backend

# CORS Configuration
app.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:verdida;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=VerdidaSportsApparelSecretKeyFor2026JWTAuthenticationTokenGeneration
jwt.expiration=86400000

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Flyway Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baselineOnMigrate=true

# Logging Configuration
logging.level.root=INFO
logging.level.sports.apparel=DEBUG

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
