spring.application.name=backend

# Default to the local profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# CORS Configuration
app.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# Database Connection (H2 Default for local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:verdida;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Auth Cookie
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Flyway Configuration - Force disabled for local
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baselineOnMigrate=true

# Logging Configuration
logging.level.root=INFO
logging.level.sports.apparel=DEBUG

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
