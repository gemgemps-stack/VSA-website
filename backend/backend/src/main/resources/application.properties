spring.application.name=backend

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.ibuumivqogsvhxoldoqi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:VerdidaWasspord123*#}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=VerdidaSportsApparelSecretKeyFor2026JWTAuthenticationTokenGeneration
jwt.expiration=86400000

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true

# Logging Configuration
logging.level.root=INFO
logging.level.sports.apparel=DEBUG

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
