app.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:verdida_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# Allow the local profile to start even when the IDE does not pass env vars.
jwt.secret=${JWT_SECRET:verdida-local-jwt-secret}
app.auth.cookie.secure=false
