app.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

spring.datasource.url=jdbc:h2:mem:verdida_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Explicitly disable Flyway for local H2 environment
spring.flyway.enabled=false

# Allow the local profile to start even when the IDE does not pass env vars.
jwt.secret=${JWT_SECRET:verdida-local-jwt-secret}
app.auth.cookie.secure=false
