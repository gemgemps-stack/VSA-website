# Production Profile Configuration

# CORS Configuration - Set via environment variable.
# Provide your deployed frontend origin(s), comma-separated.
app.cors.origins=${CORS_ORIGINS:https://verdidasportsapparel.vercel.app}
app.cors.allow-localhost=false

# Database Connection - Prefer Render/Postgres env vars, but fall back to an embedded H2 DB
# so the service can still start if the deployment environment has not supplied them yet.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:verdida;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# HikariCP Connection Pool - Optimized for Supabase (15 connection limit)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baselineOnMigrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/

# Logging
logging.level.root=WARN
logging.level.sports.apparel=INFO

# OpenAPI/Swagger - Disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expiration=86400000

# Auth Cookie
app.auth.cookie.secure=true
app.auth.cookie.same-site=None

# Actuator exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
